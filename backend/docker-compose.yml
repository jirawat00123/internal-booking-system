version: "3.8"

services:
  db:
    platform: linux/amd64
    image: postgres:15
    container_name: booking_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pZRTXiL6pPoSOCqP
      POSTGRES_DB: internalBookingDB
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: booking_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    env_file:
      - .env
    volumes:
      # 🟢 ผูกโฟลเดอร์ uploads ออกมาข้างนอก เพื่อให้รูปภาพ/ไฟล์ไม่หายเวลา Restart
      - ./uploads:/app/uploads
    depends_on:
      - db

volumes:
  pgdata: